version: 2

updates:
  # GitHub Actions used by this repository.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        # Major updates remain separate for individual review.

  # Pre-commit hooks used by this repository.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      pre-commit-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base images of everything under images/<name>/Dockerfile.
  - package-ecosystem: "docker"
    directories:
      - "/images/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(images)"
    cooldown:
      default-days: 7
    groups:
      base-images-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Hash-locked Python tools baked into images (pip-compile .in/.txt pairs).
  - package-ecosystem: "pip"
    directory: "/images/gitea-runner"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(images)"
    cooldown:
      default-days: 7
