name: Validate Helm Chart

on:
  workflow_call:
    inputs:
      chart-path:
        required: true
        type: string
        description: "Path to the Helm chart to validate"
      helm-version:
        required: false
        type: string
        default: "v3.16.3"
      kubeconform-version:
        required: false
        type: string
        default: "0.8.0"
      kubeconform-kubernetes-version:
        required: false
        type: string
        default: "1.31.0"
      kube-linter-version:
        required: false
        type: string
        default: "0.8.3"
      conftest-version:
        required: false
        type: string
        default: "0.69.0"

permissions: {}

jobs:
  helm-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ inputs.helm-version }}

      - name: Update chart dependencies
        run: helm dependency update ${{ inputs.chart-path }}

      - name: Helm lint (strict)
        run: helm lint --strict ${{ inputs.chart-path }}

  kubeconform:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ inputs.helm-version }}

      - name: Update chart dependencies
        run: helm dependency update ${{ inputs.chart-path }}

      - name: Render chart
        run: helm template ${{ inputs.chart-path }} > rendered-manifests.yaml

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${{ inputs.kubeconform-version }}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests against Kubernetes schema
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version ${{ inputs.kubeconform-kubernetes-version }} \
            -ignore-missing-schemas \
            rendered-manifests.yaml

  kube-linter:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ inputs.helm-version }}

      - name: Update chart dependencies
        run: helm dependency update ${{ inputs.chart-path }}

      - name: Render chart
        run: helm template ${{ inputs.chart-path }} > rendered-manifests.yaml

      - name: Install kube-linter
        run: |
          curl -sSL "https://github.com/stackrox/kube-linter/releases/download/v${{ inputs.kube-linter-version }}/kube-linter-linux.tar.gz" \
            | tar xz -C /usr/local/bin kube-linter

      - name: Run kube-linter
        run: kube-linter lint rendered-manifests.yaml

  server-dry-run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ inputs.helm-version }}

      - name: Create k3d cluster
        uses: AbsaOSS/k3d-action@ba94d4cdc1ddd8e577863e47d628b62226cc9e13 # v2.0.0
        with:
          cluster-name: "ci-validation"
          args: >-
            --agents 1
            --no-lb

      - name: Update chart dependencies
        run: helm dependency update ${{ inputs.chart-path }}

      - name: Server-side dry-run install
        run: |
          helm install test-release ${{ inputs.chart-path }} \
            --dry-run=server \
            --debug

  conftest-policies:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (for the chart to validate)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout homelab-ci-templates (for OPA policies)
        uses: actions/checkout@v11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Damien-Petit-Thomas/homelab-ci-templates
          path: .ci-templates
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: ${{ inputs.helm-version }}

      - name: Render chart
        run: helm template ${{ inputs.chart-path }} > rendered-manifests.yaml

      - name: Install conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${{ inputs.conftest-version }}/conftest_${{ inputs.conftest-version }}_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin conftest

      - name: Run OPA policies
        run: conftest test --policy .ci-templates/policies rendered-manifests.yaml
