name: Validate Helm Chart

on:
  workflow_call:
    inputs:
      chart-path:
        required: true
        type: string
        description: "Path to the Helm chart to validate"
      helm-version:
        required: false
        type: string
        default: "v3.16.3"
      kubeconform-version:
        required: false
        type: string
        default: "0.8.0"
      kubeconform-kubernetes-version:
        required: false
        type: string
        default: "1.31.0"
      kube-linter-version:
        required: false
        type: string
        default: "0.8.3"
      conftest-version:
        required: false
        type: string
        default: "0.69.0"

permissions: {}

jobs:
  helm-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Update chart dependencies
        run: helm dependency update ${{ inputs.chart-path }}

      - name: Helm lint (strict)
        run: helm lint --strict ${{ inputs.chart-path }}

  kubeconform:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Update chart dependencies
        run: helm dependency update ${{ inputs.chart-path }}

      - name: Render chart
        run: helm template ${{ inputs.chart-path }} > rendered-manifests.yaml

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${{ inputs.kubeconform-version }}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests against Kubernetes schema
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version ${{ inputs.kubeconform-kubernetes-version }} \
            -ignore-missing-schemas \
            rendered-manifests.yaml

  kube-linter:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Update chart dependencies
        run: helm dependency update ${{ inputs.chart-path }}

      - name: Render chart
        run: helm template ${{ inputs.chart-path }} > rendered-manifests.yaml

      - name: Install kube-linter
        run: |
          curl -sSL "https://github.com/stackrox/kube-linter/releases/download/v${{ inputs.kube-linter-version }}/kube-linter-linux.tar.gz" \
            | sudo tar xz -C /usr/local/bin kube-linter

      - name: Run kube-linter
        run: kube-linter lint rendered-manifests.yaml

  server-dry-run:
    # Verifies the manifest is acceptable to a REAL apiserver
    # (unlike client-side `helm install --dry-run`, which never
    # contacts a cluster and therefore cannot catch server-side
    # validation errors — missing CRDs, admission webhooks).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      K3D_VERSION: "5.9.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Install k3d
        # AbsaOSS/k3d-action is unmaintained (last pushed ~2 years ago)
        # and broke after k3d migrated from rancher/k3d to k3d-io/k3d —
        # its bundled install path 404s. Installing the pinned release
        # binary directly avoids depending on that stale action.
        run: |
          curl -fsSLo k3d \
            "https://github.com/k3d-io/k3d/releases/download/v${K3D_VERSION}/k3d-linux-amd64"
          chmod +x k3d
          sudo mv k3d /usr/local/bin/k3d
          k3d version

      - name: Create k3d cluster
        run: k3d cluster create ci-validation --agents 1 --no-lb --wait

      - name: Update chart dependencies
        run: helm dependency update ${{ inputs.chart-path }}

      - name: Server-side dry-run install
        run: |
          helm install test-release ${{ inputs.chart-path }} \
            --dry-run=server \
            --debug

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete ci-validation || true

  conftest-policies:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (for the chart to validate)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout homelab-ci-templates (for OPA policies)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Damien-Petit-Thomas/homelab-ci-templates
          path: .ci-templates
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Update chart dependencies
        run: helm dependency update ${{ inputs.chart-path }}

      - name: Render chart
        run: helm template ${{ inputs.chart-path }} > rendered-manifests.yaml

      - name: Install conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${{ inputs.conftest-version }}/conftest_${{ inputs.conftest-version }}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin conftest

      - name: Run OPA policies
        run: conftest test --policy .ci-templates/policies rendered-manifests.yaml
