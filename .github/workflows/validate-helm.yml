name: Validate Helm Chart

on:
  workflow_call:
    inputs:
      chart-path:
        required: true
        type: string
        description: "Path to the Helm chart to validate"
      helm-version:
        required: false
        type: string
        default: "v3.16.3"
      kubeconform-version:
        required: false
        type: string
        default: "0.8.0"
      kubeconform-kubernetes-version:
        required: false
        type: string
        default: "1.31.0"
      kube-linter-version:
        required: false
        type: string
        default: "0.8.3"
      conftest-version:
        required: false
        type: string
        default: "0.69.0"

permissions: {}

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      CHART_PATH: ${{ inputs.chart-path }}
      HELM_VERSION: ${{ inputs.helm-version }}
      KUBECONFORM_VERSION: ${{ inputs.kubeconform-version }}
      KUBECONFORM_K8S_VERSION: ${{ inputs.kubeconform-kubernetes-version }}
      KUBE_LINTER_VERSION: ${{ inputs.kube-linter-version }}
      CONFTEST_VERSION: ${{ inputs.conftest-version }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ -n "$CHART_PATH" ]] || fail "chart-path is empty"
          [[ "$CHART_PATH" =~ ^[A-Za-z0-9._/-]+$ ]] || fail "chart-path contains forbidden characters"
          [[ "$CHART_PATH" != /* && "/$CHART_PATH/" != */../* ]] || fail "chart-path must be relative, without '..'"
          for var in HELM_VERSION KUBECONFORM_VERSION KUBECONFORM_K8S_VERSION KUBE_LINTER_VERSION CONFTEST_VERSION; do
            val="${!var}"
            [[ "$val" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "$var='$val' is not an X.Y.Z version"
          done
          echo "inputs OK"
  helm-lint:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      INPUTS_CHART_PATH: ${{ inputs.chart-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Update chart dependencies
        run: helm dependency update "${INPUTS_CHART_PATH}"

      - name: Helm lint (strict)
        run: helm lint --strict "${INPUTS_CHART_PATH}"

  kubeconform:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      INPUTS_CHART_PATH: ${{ inputs.chart-path }}
      INPUTS_KUBECONFORM_VERSION: ${{ inputs.kubeconform-version }}
      INPUTS_KUBECONFORM_KUBERNETES_VERSION: ${{ inputs.kubeconform-kubernetes-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Update chart dependencies
        run: helm dependency update "${INPUTS_CHART_PATH}"

      - name: Render chart
        run: helm template "${INPUTS_CHART_PATH}" > rendered-manifests.yaml

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${INPUTS_KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests against Kubernetes schema
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version "${INPUTS_KUBECONFORM_KUBERNETES_VERSION}" \
            -ignore-missing-schemas \
            rendered-manifests.yaml

  kube-linter:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      INPUTS_CHART_PATH: ${{ inputs.chart-path }}
      INPUTS_KUBE_LINTER_VERSION: ${{ inputs.kube-linter-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Update chart dependencies
        run: helm dependency update "${INPUTS_CHART_PATH}"

      - name: Render chart
        run: helm template "${INPUTS_CHART_PATH}" > rendered-manifests.yaml

      - name: Install kube-linter
        run: |
          curl -sSL "https://github.com/stackrox/kube-linter/releases/download/v${INPUTS_KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz" \
            | sudo tar xz -C /usr/local/bin kube-linter

      - name: Run kube-linter
        run: kube-linter lint rendered-manifests.yaml

  server-dry-run:
    needs: validate-inputs
    # Verifies the manifest is acceptable to a REAL apiserver
    # (unlike client-side `helm install --dry-run`, which never
    # contacts a cluster and therefore cannot catch server-side
    # validation errors — missing CRDs, admission webhooks).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      K3D_VERSION: "5.9.0"
      INPUTS_CHART_PATH: ${{ inputs.chart-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Install k3d
        # AbsaOSS/k3d-action is unmaintained (last pushed ~2 years ago)
        # and broke after k3d migrated from rancher/k3d to k3d-io/k3d —
        # its bundled install path 404s. Installing the pinned release
        # binary directly avoids depending on that stale action.
        run: |
          curl -fsSLo k3d \
            "https://github.com/k3d-io/k3d/releases/download/v${K3D_VERSION}/k3d-linux-amd64"
          chmod +x k3d
          sudo mv k3d /usr/local/bin/k3d
          k3d version

      - name: Create k3d cluster
        run: k3d cluster create ci-validation --agents 1 --no-lb --wait

      - name: Update chart dependencies
        run: helm dependency update "${INPUTS_CHART_PATH}"

      - name: Server-side dry-run install
        run: |
          helm install test-release "$INPUT_CHART_PATH" \
            --dry-run=server \
            --debug

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete ci-validation || true

  conftest-policies:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      INPUTS_CHART_PATH: ${{ inputs.chart-path }}
      INPUTS_CONFTEST_VERSION: ${{ inputs.conftest-version }}
    steps:
      - name: Checkout (for the chart to validate)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout homelab-ci-templates (for OPA policies)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Damien-Petit-Thomas/homelab-ci-templates
          path: .ci-templates
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Update chart dependencies
        run: helm dependency update "${INPUTS_CHART_PATH}"

      - name: Render chart
        run: helm template "${INPUTS_CHART_PATH}" > rendered-manifests.yaml

      - name: Install conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${INPUTS_CONFTEST_VERSION}/conftest_${INPUTS_CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin conftest

      - name: Run OPA policies
        run: conftest test --policy .ci-templates/policies rendered-manifests.yaml
