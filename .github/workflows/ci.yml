# Internal CI: exercises this repository's own reusable workflow
# (validate-helm.yml) against a minimal fixture chart, so that a
# real pass/fail signal exists for this repo — not just for the
# repos that consume it. Also runs actionlint on every workflow
# file for basic syntax/schema correctness.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl -fsSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          tar xzf actionlint.tar.gz actionlint

      - name: Run actionlint
        run: ./actionlint

      - name: Every CI job is gated by ci-ok
        run: |
          missing="$(yq -o=json '.' .github/workflows/ci.yml \
            | jq -r '(.jobs | keys) - ["ci-ok"] - .jobs["ci-ok"].needs | .[]')"
          [[ -z "$missing" ]] || { echo "::error::jobs not gated by ci-ok: ${missing//$'\n'/, }"; exit 1; }
          echo "every CI job is gated by ci-ok"

  test-validate-helm:
    # Exercises this repo's own reusable workflow against a known-good
    # fixture chart. A regression in validate-helm.yml itself (e.g. a
    # broken command, a missing permission) would fail here.
    #
    # This job needs its own `permissions` block: with workflow-level
    # `permissions: {}`, the called reusable workflow would otherwise
    # have no token permissions at all and fail at its own checkout step.
    permissions:
      contents: read
    uses: ./.github/workflows/validate-helm.yml
    with:
      chart-path: test-fixtures/hello-test

  # Negative tests: each fixture carries exactly one violation, and conftest
  # must reject it WITH the expected policy message. A failure for any other
  # reason (Rego syntax error, render error) does not count as a pass.
  policies-reject-bad-charts:
    name: policies-reject-bad-charts (${{ matrix.fixture }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: bad-latest-tag
            expected: "uses ':latest' tag"
          - fixture: bad-raw-secret
            expected: "manifest defines a raw Secret"
    env:
      FIXTURE: test-fixtures/${{ matrix.fixture }}
      EXPECTED: ${{ matrix.expected }}
      CONFTEST_VERSION: "0.69.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install conftest (checksum verified)
        run: |
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          asset="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "${base}/${asset}"
          curl -fsSL "${base}/checksums.txt" | grep " ${asset}\$" | sha256sum -c -
          sudo tar xzf "${asset}" -C /usr/local/bin conftest

      - name: conftest must reject the fixture, with the expected message
        run: |
          helm template "$FIXTURE" > rendered.yaml
          rc=0; out="$(conftest test --policy policies rendered.yaml 2>&1)" || rc=$?
          echo "$out"
          [[ "$rc" -ne 0 ]] || { echo "::error::$FIXTURE was accepted: the policy is not enforced"; exit 1; }
          [[ "$out" == *"$EXPECTED"* ]] || { echo "::error::$FIXTURE rejected for the wrong reason (expected: $EXPECTED)"; exit 1; }
          echo "OK: rejected with the expected message"


  # Single required status check for the ruleset: stable name, independent of
  # matrix values, and new jobs only need to be added here.
  docs-up-to-date:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generated reference matches the workflows
        run: |
          scripts/gen-workflow-reference.sh > "${RUNNER_TEMP}/workflows.md" \
            || { echo "::error::scripts/gen-workflow-reference.sh failed"; exit 1; }
          diff -u docs/reference/workflows.md "${RUNNER_TEMP}/workflows.md" \
            || { echo "::error::docs/reference/workflows.md is stale: run scripts/gen-workflow-reference.sh and commit"; exit 1; }

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - actionlint
      - test-validate-helm
      - policies-reject-bad-charts
      - docs-up-to-date
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [[ "$r" == "success" ]] || { echo "::error::a required job ended with: $r"; exit 1; }
          done
          echo "all required jobs succeeded"
