# zizmor: static analysis for GitHub Actions workflows. Catches issues
# like template injection, excessive permissions, and credential
# leakage in the workflow files themselves — not the application
# code they run.
#
# Exposed as a reusable workflow so every repository in this homelab
# (homelab-charts, homelab-argocd, homelab-iac, homelab-ansible) can
# scan its OWN workflow files, not just the ones defined here. This
# repository also calls it on itself via ci.yml.
name: zizmor

on:
  workflow_call:
    inputs:
      paths:
        required: false
        type: string
        default: ""
        description: >
          Space-separated workflow files to scan. Empty (default): every
          *.yml/*.yaml under .github/workflows and .gitea/workflows.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Static analysis of workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve scan targets
        id: targets
        env:
          REQUESTED: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          targets="${REQUESTED:-}"
          if [ -z "$targets" ]; then
            for d in .github/workflows .gitea/workflows; do
              [ -d "$d" ] || continue
              for f in "$d"/*.yml "$d"/*.yaml; do
                [ -f "$f" ] && targets="$targets $f"
              done
            done
          fi
          targets="${targets# }"
          [ -n "$targets" ] || { echo "::error::no workflow files found"; exit 1; }
          echo "Scanning: $targets"
          echo "paths=$targets" >> "$GITHUB_OUTPUT"

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          inputs: ${{ steps.targets.outputs.paths }}
          # GitHub-only features: SARIF upload to Code Scanning, and online
          # audits querying api.github.com. Disabled automatically when the
          # workflow runs on another forge (e.g. Gitea, through a mirror).
          advanced-security: ${{ github.server_url == 'https://github.com' }}
          online-audits: ${{ github.server_url == 'https://github.com' }}
