# zizmor: static analysis for GitHub Actions workflows (template injection,
# excessive permissions, credential leakage...), run on the workflow files
# themselves.
#
# Reusable: every homelab repository calls it to scan its OWN workflows.
# Works on GitHub and on Gitea (through a mirror of this repository):
#   - scan targets are auto-detected in .github/workflows and .gitea/workflows;
#   - on GitHub, zizmor-action runs with SARIF upload and online audits;
#   - elsewhere, zizmor runs natively: zizmor-action's nested container can't
#     see the job workspace under DinD, and online audits need a GitHub token.
name: zizmor

on:
  workflow_call:
    inputs:
      paths:
        required: false
        type: string
        default: ""
        description: >
          Space-separated workflow files to scan. Empty (default): every
          *.yml/*.yaml under .github/workflows and .gitea/workflows.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Static analysis of workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # SARIF upload to Code Scanning (GitHub only)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve scan targets
        id: targets
        env:
          REQUESTED: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          targets="${REQUESTED:-}"
          if [ -z "$targets" ]; then
            for d in .github/workflows .gitea/workflows; do
              [ -d "$d" ] || continue
              for f in "$d"/*.yml "$d"/*.yaml; do
                [ -f "$f" ] && targets="$targets $f"
              done
            done
          fi
          targets="${targets# }"
          [ -n "$targets" ] || { echo "::error::no workflow files found"; exit 1; }
          echo "Scanning: $targets"
          echo "paths=$targets" >> "$GITHUB_OUTPUT"

      - name: Run zizmor (GitHub)
        if: github.server_url == 'https://github.com'
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: ${{ steps.targets.outputs.paths }}

      - name: Run zizmor (other forges)
        if: github.server_url != 'https://github.com'
        env:
          TARGETS: ${{ steps.targets.outputs.paths }}
          ZIZMOR_VERSION: "1.30.0"
        run: |
          set -euo pipefail
          [ -n "$TARGETS" ] || { echo "::error::empty scan target list"; exit 1; }
          python3 -m venv /tmp/zizmor
          /tmp/zizmor/bin/pip install --quiet "zizmor==${ZIZMOR_VERSION}"
          # TARGETS is a space-separated file list: word splitting intended.
          # shellcheck disable=SC2086
          /tmp/zizmor/bin/zizmor --offline --format=plain $TARGETS
